# ------------------------------------------------------------------ research
[research]
statement = "I study how automated systems *score speech*: where they agree with human raters, where they do not, and who is affected when they get it wrong."
themes = ["Language assessment", "Automated speaking assessment", "Validity & fairness", "Responsible AI in education", "Explainable machine learning", "L2 pronunciation", "Multilingual education & policy", "Seal of Biliteracy", "Quantitative & mixed methods"]

# "dates" is shown as written on the website; " to " becomes a hyphen in the CV PDF.
# cv_title / cv_text: use these only if the CV should word something differently from the website.
[[projects]]
dates    = "2025 to Present"
title    = "Dissertation: Validity & Fairness of *Automated Speaking Assessment*"
cv_title = "Dissertation: Validity and Fairness of Automated Speaking Assessment"
org      = "University of Kansas"
text     = "Examines agreement and decision risk between human holistic ratings and automated scores from the released Speak & Improve Challenge 2025 baseline scorer (Cambridge Speak & Improve Corpus 2025), and what predicts their disagreement."
cv_text  = "Examines agreement and decision risk between human holistic ratings and automated scores from the released Speak & Improve Challenge 2025 baseline scorer (Cambridge Speak & Improve Corpus 2025), and what predicts their disagreement."

[[projects]]
dates    = "2025 to Present"
title    = "Explainable Machine Learning for *L2 Pronunciation*"
cv_title = "Explainable Machine Learning for L2 Pronunciation"
text     = "Interpretable MFCC-based models of how a first language shapes L2 pronunciation, plus reproducible workflows for feedback."
cv_text  = "Develops interpretable MFCC-based models of L1 influence in L2 pronunciation and reproducible workflows for feedback."

[[projects]]
dates    = "2025 to Present"
title    = "Seal of Biliteracy: *Policy, Equity & Recognition*"
cv_title = "Seal of Biliteracy Policy, Equity, and Recognition"
text     = "How the Seal of Biliteracy is implemented, who can earn it, how students qualify, and whether colleges and employers recognize it. With CEOP colleagues I am also studying Seal attainment by English learner status and district locale across all 50 states and DC; data collection began in 2026."
cv_text  = "Examines implementation, equitable access, assessment pathways, postsecondary recognition, and real-world value of the Seal of Biliteracy. A national access study with CEOP colleagues examines Seal attainment by English learner status and district locale across all 50 states and DC (data collection began in 2026)."

[[projects]]
dates    = "2026 to Present"
title    = "English Learner Visibility in *Kansas Public Reporting*"
cv_title = "English Learner Visibility in Kansas Public Reporting"
text     = "How districts report English learner results, which student groups become invisible, and how small cohort sizes create gaps in public data. The Kansas analysis is complete (white paper, August 2026; journal version under review), and the study is now extending to about ten more states with CEOP colleagues."
cv_text  = "Examines district-level English learner result reporting, subgroup visibility, and how cohort size shapes public reporting gaps. The Kansas analysis is complete (white paper, August 2026; journal version under review); the study is now extending to about ten more states with CEOP colleagues."


