<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>Page not found | Peyman Jahanbin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0a;color:#ece7dc}
body{display:grid;place-items:center;padding:24px;font:400 16px/1.6 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px}
.k{font:500 11px 'Instrument Sans',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#b99a5b;display:flex;align-items:center;gap:18px;margin-bottom:26px}
.k::before{content:"";width:44px;height:1px;background:#b99a5b}
h1{font:300 clamp(48px,11vw,96px)/.95 'Cormorant Garamond',Georgia,serif;letter-spacing:-.02em}
h1 em{color:#d6b87a}
p{margin-top:22px;font:300 22px/1.45 'Cormorant Garamond',Georgia,serif;color:#c9c3b6}
a{display:inline-block;margin-top:38px;font:500 11px 'Instrument Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#ece7dc;text-decoration:none;padding-bottom:6px;border-bottom:1px solid #b99a5b;transition:color .3s,border-color .3s}
a:hover{color:#d6b87a;border-color:#d6b87a}
a:focus-visible{outline:1px solid #d6b87a;outline-offset:5px}
</style>
</head>
<body>
<main>
  <div class="k">Error 404</div>
  <h1>Page not <em>found.</em></h1>
  <p>The page you were looking for does not exist or has moved.</p>
  <a href="/">Return to the homepage</a>
</main>
</body>
</html>
