<!doctype html>
<html lang="en">
<head>
@@HEAD@@
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg2:#101010; --ink:#ece7dc; --soft:#c9c3b6; --muted:#857f74;
  --gold:#b99a5b; --gold-hi:#d6b87a; --line:rgba(236,231,220,.13); --line2:rgba(236,231,220,.07);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  --pad:clamp(22px,5vw,64px); --ease:cubic-bezier(.2,.7,.2,1); --secpad:clamp(80px,12vw,150px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:#2c2a26 var(--bg)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#2a2824;border:2px solid var(--bg);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#3b372f}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-kerning:normal}
h1,h2,h3,.statement,.lede,.big{text-wrap:balance}
p,dd{text-wrap:pretty}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:5px}
.skip{position:fixed;left:16px;top:-64px;z-index:100;background:var(--gold);color:#0a0a0a;font:500 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 18px;transition:top .25s}
.skip:focus{top:14px}
#bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:60;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;pointer-events:none}
::selection{background:var(--gold);color:#0a0a0a}
a{color:inherit;text-decoration:none}
.caps{font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:40;transition:background .4s,border-color .4s;border-bottom:1px solid transparent}
nav.s{background:rgba(10,10,10,.94);border-color:var(--line2)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:72px}
.mono{font:italic 400 24px var(--serif);color:var(--gold);letter-spacing:.02em}
nav ul{display:flex;gap:34px;list-style:none}
nav ul a{font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--soft);position:relative;padding:6px 0}
nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--gold);transition:width .35s}
nav ul a:hover{color:var(--ink)}
nav ul a:hover::after,nav ul a[aria-current="true"]::after{width:100%}
nav ul a[aria-current="true"]{color:var(--ink)}
.menu{display:none;background:none;border:0;cursor:pointer;color:var(--soft);font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;padding:12px 0}
.sheet{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:72px var(--pad) 40px;opacity:0;visibility:hidden;transition:opacity .45s var(--ease),visibility .45s}
.sheet.open{opacity:1;visibility:visible}
.sheet a{display:block;font:300 clamp(32px,9vw,52px)/1.16 var(--serif);padding:4px 0;color:var(--ink);transform:translateY(14px);opacity:0;transition:transform .7s var(--ease),opacity .7s var(--ease),color .3s}
.sheet.open a{transform:none;opacity:1}
.sheet.open li:nth-child(2) a{transition-delay:.05s}.sheet.open li:nth-child(3) a{transition-delay:.1s}.sheet.open li:nth-child(4) a{transition-delay:.15s}.sheet.open li:nth-child(5) a{transition-delay:.2s}.sheet.open li:nth-child(6) a{transition-delay:.25s}.sheet.open li:nth-child(7) a{transition-delay:.3s}.sheet.open li:nth-child(8) a{transition-delay:.35s}.sheet.open li:nth-child(9) a{transition-delay:.4s}.sheet.open li:nth-child(10) a{transition-delay:.45s}
.sheet a[aria-current="true"]{color:var(--gold-hi);font-style:italic}
.sheet ul{list-style:none}
nav.open{background:transparent;backdrop-filter:none;border-color:transparent}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;padding-top:72px}
.hero-top{position:relative;z-index:2;width:100%;padding-top:clamp(28px,6vh,90px)}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(58% 52% at 20% 30%,rgba(185,154,91,.085),transparent 72%),
  radial-gradient(38% 36% at 90% 6%,rgba(236,231,220,.04),transparent 72%)}
.mast{display:flex;align-items:center;gap:22px;margin-bottom:clamp(16px,3vh,34px)}
.mrule{flex:1 1 auto;height:1px;background:linear-gradient(to right,rgba(236,231,220,.18),rgba(236,231,220,.03))}
.mmeta{font:500 11px/1.7 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.hero .caps{margin:0;display:flex;align-items:center;gap:18px;line-height:1.7;text-wrap:balance}
.hero .caps::before{content:"";flex:none;width:44px;height:1px;background:var(--gold)}
h1{font:300 clamp(60px,21vw,92px)/.9 var(--serif);letter-spacing:-.025em}
.ln{display:block;overflow:hidden;padding:.1em .12em .18em;margin:-.1em -.12em -.18em}
.ln>span{display:block}
h1 em{font-style:italic;font-weight:300;color:var(--gold-hi);text-shadow:0 0 .42em rgba(214,184,122,.2)}
.lede{max-width:540px;margin-top:30px;font:300 clamp(19px,2vw,24px)/1.5 var(--serif);color:var(--soft)}
.lede i{color:var(--ink)}
.viz{position:relative;flex:1 1 auto;min-height:clamp(190px,27svh,290px);margin-top:clamp(8px,2vh,26px)}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.viz .ov{z-index:2}
.viz::after{content:"";position:absolute;left:0;right:0;top:0;height:34%;pointer-events:none;background:linear-gradient(to bottom,var(--bg),rgba(10,10,10,0))}
/* readout that follows the cursor over the spectrogram and the figure */
.tip{position:absolute;z-index:5;display:none;pointer-events:none;padding:9px 12px;min-width:150px;font:400 12.5px/1.55 var(--sans);color:var(--soft);background:rgba(14,14,14,.94);border:1px solid rgba(185,154,91,.38)}
.tip b{display:block;font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:3px}
.tip i{font-style:normal;color:var(--ink)}
.tip em{font-style:normal;color:var(--gold-hi)}
.hero-foot{position:relative;z-index:2;width:100%}
.hero-bot{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:20px 0 28px;border-top:1px solid var(--line)}
.cue{display:flex;align-items:center;gap:16px;font:500 11px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--soft);transition:color .3s}
.cue:hover{color:var(--gold-hi)}
.cue i{position:relative;display:block;width:1px;height:40px;background:var(--line);overflow:hidden}
.cue i::after{content:"";position:absolute;left:0;top:-16px;width:1px;height:16px;background:linear-gradient(to bottom,transparent,var(--gold-hi));animation:drip 2.6s cubic-bezier(.65,0,.3,1) 2.2s infinite}
@keyframes drip{0%{transform:translateY(0)}65%,100%{transform:translateY(60px)}}
.links{display:flex;gap:28px;flex-wrap:wrap}
.links a{font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--gold);transition:color .3s,border-color .3s}
.links a:hover{color:var(--gold-hi);border-color:var(--gold-hi)}
@media (min-width:821px){h1{font-size:clamp(88px,10.4vw,156px)}}
@media (max-width:999px){.mrule,.mmeta{display:none}}
/* wide screens: a larger name, with the tagline set to its right and sitting on its baseline */
@media (min-width:1000px){
  h1{font-size:clamp(100px,min(10.6vw,22svh),216px);line-height:.88}
  .title{display:grid;grid-template-columns:auto minmax(240px,1fr);column-gap:clamp(32px,5vw,80px);align-items:end}
  .title .lede{margin:0 0 .35em;justify-self:end;max-width:350px;font-size:clamp(19px,1.5vw,25px)}
}
/* staged entrance */
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rise{from{transform:translateY(108%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero .mast{animation:up 1s var(--ease) .1s both}
.ln>span{animation:rise 1.25s var(--ease) both}
.ln:nth-child(1)>span{animation-delay:.22s}.ln:nth-child(2)>span{animation-delay:.36s}
.lede{animation:up 1.1s var(--ease) .62s both}
.hero .viz{animation:fade 2.2s ease .75s both}
.hero-foot{animation:up 1s var(--ease) 1.05s both}

/* sections: ledger */
section{padding:var(--secpad) 0 0;scroll-margin-top:calc(var(--secpad) * -1 + 96px)}
.sec{position:relative;display:grid;grid-template-columns:230px 1fr;gap:clamp(24px,5vw,72px);padding-top:30px}
.sec::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.js .sec::before{transform:scaleX(0);transform-origin:0 50%;transition:transform 1.6s var(--ease)}
.js .sec.in::before{transform:none}
.lab{position:sticky;top:104px;align-self:start}
.lab .n{font:italic 300 52px/1 var(--serif);color:var(--gold);display:block;margin-bottom:14px}
.lab h2{font:500 11px/1.5 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
.body{min-width:0}

.intro{display:grid;grid-template-columns:1fr 330px;gap:clamp(28px,5vw,64px);align-items:center}
.portrait{position:relative;margin:0;aspect-ratio:4/5;overflow:hidden;background:#f3f1ee;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.pframe{position:relative}
.pframe::before{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid var(--gold);opacity:.55;z-index:0;pointer-events:none}
.pframe .portrait{z-index:1}
.statement{font:300 clamp(24px,2.7vw,34px)/1.3 var(--serif);color:var(--ink);max-width:760px}
.statement em{color:var(--gold-hi)}
.themes{margin-top:44px;display:flex;flex-wrap:wrap;gap:8px 0;color:var(--muted);font:400 14px var(--sans);letter-spacing:.02em}
.themes span:not(:last-child)::after{content:"·";margin:0 14px;color:var(--gold)}

/* publications: topic filter, citation buttons */
.topics{display:none;flex-wrap:wrap;align-items:baseline;gap:4px 24px;margin:2px 0 16px}
.js .topics{display:flex}
.toplab{font:500 10px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-right:-6px}
.topic{background:none;border:0;cursor:pointer;font:400 13.5px var(--sans);color:var(--muted);padding:3px 0;transition:color .3s}
.topic:hover{color:var(--ink)}
.topic[aria-pressed="true"]{color:var(--gold-hi)}
.topic .ct{margin-left:7px;color:var(--gold);font-size:11px}
.none{padding:34px 0;color:var(--muted);font:italic 300 22px var(--serif);border-top:1px solid var(--line2)}
.with{display:block;margin-top:5px;font:400 13.5px var(--sans);color:var(--muted)}
.cite{margin-top:12px;display:flex;gap:20px;flex-wrap:wrap}
.cbtn{background:none;border:0;border-bottom:1px solid var(--line);padding:2px 0;cursor:pointer;font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .3s,border-color .3s}
.cbtn:hover,.cbtn.ok{color:var(--gold-hi);border-color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* dossier */
.dossier{margin-top:64px;max-width:760px}
.dnote{margin:16px 0 18px;font:300 clamp(19px,1.9vw,23px)/1.45 var(--serif);color:var(--soft)}
.fig{margin:64px 0 0}
.figt{font:500 11px/1.5 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.scope{position:relative;height:clamp(270px,34vw,340px);margin-top:18px;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig figcaption{margin-top:16px;max-width:660px;font:400 14px/1.65 var(--sans);color:var(--muted)}
.items{margin-top:56px}
.item{display:grid;grid-template-columns:120px 1fr;gap:28px;padding:26px 0;border-top:1px solid var(--line2)}
.item:last-child{border-bottom:1px solid var(--line2)}
.when{font:500 11px/1.9 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.item h3{font:400 clamp(22px,2.4vw,28px)/1.25 var(--serif);color:var(--ink)}
.item h3 em{font-style:italic;font-weight:300}
.item .who{font:400 14px var(--sans);color:var(--gold);margin-top:3px}
.item p{margin-top:10px;color:var(--soft);font-size:15.5px;max-width:640px}

/* publications */
.tabs{display:none;gap:30px;margin-bottom:10px;flex-wrap:wrap}
.js .tabs{display:flex}
.tab .ct{margin-left:9px;color:var(--gold);letter-spacing:0;font-weight:500}
.tab{background:none;border:0;cursor:pointer;font:500 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-bottom:1px solid transparent;transition:.3s}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--gold-hi);border-color:var(--gold)}
.pub{display:grid;grid-template-columns:64px 1fr;gap:24px;padding:26px 0;border-top:1px solid var(--line2)}
.pub[hidden]{display:none}
.yr{font:italic 300 26px/1.1 var(--serif);color:var(--gold)}
.pub h3{font:400 clamp(20px,2.1vw,24px)/1.3 var(--serif)}
.au{margin-top:8px;font-size:14px;color:var(--muted)}
.au b{color:var(--soft);font-weight:500}
.ven{margin-top:6px;font-size:14px;color:var(--soft)}
.ven i{font-family:var(--serif);font-size:16px}
.st{display:inline-block;margin-right:10px;font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.doi{font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-left:8px;border-bottom:1px solid var(--line);transition:.3s}
.doi:hover{color:var(--gold-hi);border-color:var(--gold)}
.more{margin-top:34px}
.sub{margin:70px 0 6px;font:italic 300 28px var(--serif);color:var(--soft)}
.nb{white-space:nowrap}
.pub h3,.item h3,.row .t{transition:color .4s}
@media (hover:hover){.pub:hover h3,.item:hover h3,.row:hover .t{color:var(--gold-hi)}}
.when,.row .r,.award span,.code{font-variant-numeric:tabular-nums}

/* ledger rows (teaching, awards, skills) */
.row{display:grid;grid-template-columns:110px 1fr auto;gap:24px;padding:15px 0;border-top:1px solid var(--line2);align-items:baseline}
.row:last-child{border-bottom:1px solid var(--line2)}
.row .code{font:500 11px var(--sans);letter-spacing:.14em;color:var(--gold)}
.row .t{font:400 20px/1.35 var(--serif)}
.row .r{font-size:13px;color:var(--muted);text-align:right}
.grp{margin:44px 0 6px;font:500 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.grp:first-child{margin-top:0}
.dl{display:grid;grid-template-columns:200px 1fr;gap:6px 28px;padding:20px 0;border-top:1px solid var(--line2)}
.dl:last-child{border-bottom:1px solid var(--line2)}
.dl dt{font:500 11px/1.9 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.dl dd{color:var(--soft);font-size:15.5px}
.award{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-top:1px solid var(--line2);font:400 20px/1.35 var(--serif)}
.award:last-child{border-bottom:1px solid var(--line2)}
.award span{font:400 13px var(--sans);color:var(--muted);text-align:right;white-space:nowrap}

/* methods, service, languages */
.tight{--secpad:clamp(56px,8vw,96px)}
.meth{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(28px,5vw,64px)}
.mcol{padding:26px 0 30px;border-top:1px solid var(--line2)}
.mcol h3{font:italic 300 clamp(24px,2.4vw,30px)/1.2 var(--serif);color:var(--gold-hi);margin-bottom:16px}
.mcol ul{list-style:none}
.mcol li{position:relative;padding:5px 0 5px 22px;color:var(--soft);font-size:15.5px;line-height:1.55}
.mcol li::before{content:"";position:absolute;left:3px;top:.95em;width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
.mcol li small{display:block;color:var(--muted);font-size:13.5px}
.svc{display:grid;grid-template-columns:130px 1fr;gap:28px;padding:24px 0;border-top:1px solid var(--line2)}
.svc:last-child{border-bottom:1px solid var(--line2)}
.svc .yrs{font:italic 300 24px/1.2 var(--serif);color:var(--gold)}
.svc h3{font:400 clamp(21px,2.2vw,26px)/1.25 var(--serif)}
.svc .who{font:400 14px var(--sans);color:var(--soft);margin-top:4px}
.svc p{margin-top:8px;color:var(--muted);font-size:15px;max-width:620px}
.tally{list-style:none;margin-top:14px;max-width:520px}
.tally li{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-top:1px dashed var(--line);font-size:14.5px;color:var(--soft)}
.tally i{font:italic 400 17px/1.3 var(--serif);color:var(--ink)}
.tally span{color:var(--gold);white-space:nowrap}
.langs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.lang{padding:34px 20px 34px 0}
.lang+.lang{border-left:1px solid var(--line2);padding-left:clamp(18px,2.6vw,34px)}
.lang .nm{font:300 clamp(30px,3.4vw,46px)/1.05 var(--serif);letter-spacing:-.01em}
.lang .lv{margin-top:14px;font:500 11px/1.7 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

/* contact */
.contact{--secpad:clamp(90px,14vw,180px);padding:var(--secpad) 0 0;text-align:left}
.big{font:300 clamp(44px,8vw,112px)/.98 var(--serif);letter-spacing:-.02em}
.big em{color:var(--gold-hi)}
.mail{display:inline-block;margin-top:42px;font:300 clamp(24px,3.4vw,42px) var(--serif);border-bottom:1px solid var(--gold);padding-bottom:6px;transition:.3s}
.mail:hover{color:var(--gold-hi)}
.contact .links{margin-top:50px}
footer{margin-top:clamp(90px,12vw,150px);border-top:1px solid var(--line);padding:26px 0 40px;font:500 10px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{transition:color .3s}footer a:hover{color:var(--gold-hi)}

/* reveal */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}

@media (max-width:1000px){.intro{grid-template-columns:1fr 240px}.statement{font-size:clamp(22px,3vw,28px)}}
@media (max-width:820px){
  .meth{grid-template-columns:1fr}
  .svc{grid-template-columns:1fr;gap:6px}
  .langs{grid-template-columns:1fr}
  .lang{padding:24px 0}
  .lang+.lang{border-left:0;border-top:1px solid var(--line2);padding-left:0}
  .intro{grid-template-columns:1fr}
  .pframe{order:-1;max-width:260px;margin-right:14px}
  nav ul{display:none}
  .menu{display:block}
  .hero .caps{letter-spacing:.18em}
  .links{gap:22px}.links a{letter-spacing:.16em}
  .viz{min-height:240px}
  .cue{display:none}
  .sec{grid-template-columns:1fr;gap:26px}
  .lab{position:static;display:flex;align-items:baseline;gap:18px}
  .lab .n{font-size:38px;margin:0}
  .item{grid-template-columns:1fr;gap:6px}
  .row{grid-template-columns:1fr;gap:2px}
  .row .r{text-align:left}
  .dl{grid-template-columns:1fr}
  .pub{grid-template-columns:1fr;gap:8px}
  .award{flex-direction:column;gap:2px}.award span{text-align:left}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1;transform:none;transition:none}.hero .mast,.ln>span,.lede,.hero .viz,.hero-foot,.cue i::after{animation:none}.js .sec::before{transform:none;transition:none}.sheet,.sheet a{transition:none}}
@media print{nav,#bar,.viz,.scope,.sheet{display:none}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
@@SKIP@@
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function(){
  var d=document,de=d.documentElement,nav=d.getElementById('nav'),bar=d.getElementById('bar');
  var calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var navOn=false,docH=0,queued=false;

  // header background once you leave the top, and the thin reading-progress line
  function measure(){docH=de.scrollHeight-innerHeight}
  function frame(){
    queued=false;
    var y=scrollY,on=y>40;
    if(on!==navOn){navOn=on;nav.classList.toggle('s',on)}
    bar.style.transform='scaleX('+(docH>0?Math.min(y/docH,1):0)+')';
  }
  function request(){if(!queued){queued=true;requestAnimationFrame(frame)}}
  addEventListener('scroll',request,{passive:true});
  var remeasure=function(){measure();request()};
  addEventListener('resize',remeasure);
  addEventListener('load',remeasure);
  if(d.fonts&&d.fonts.ready)d.fonts.ready.then(remeasure);
  if(window.ResizeObserver)new ResizeObserver(remeasure).observe(d.body);
  measure();frame();

  // "back to top" links
  d.querySelectorAll('a[href="#top"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();scrollTo({top:0,behavior:calm?'auto':'smooth'})})});

  // each block fades in once as it arrives
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  d.querySelectorAll('.rv,.sec').forEach(function(el){io.observe(el)});

  // publications: a status filter and a topic filter (they combine), live counts, and citation buttons
  var pubs=d.querySelectorAll('.pub'),tabs=d.querySelectorAll('.tab'),none=d.getElementById('pubnone'),fStatus='all',fTopic='all';
  var TOPICS=@@TOPICS@@;
  var hasTopic=function(p,t){return (' '+(p.dataset.topics||'')+' ').indexOf(' '+t+' ')>-1};
  function applyFilters(){
    var shown=0;
    pubs.forEach(function(p){
      var ok=(fStatus==='all'||p.dataset.k===fStatus)&&(fTopic==='all'||hasTopic(p,fTopic));
      p.hidden=!ok;if(ok)shown++;
    });
    if(none)none.hidden=shown>0;
    remeasure();
  }
  tabs.forEach(function(b){
    var k=b.dataset.f,n=k==='all'?pubs.length:d.querySelectorAll('.pub[data-k="'+k+'"]').length;
    b.insertAdjacentHTML('beforeend','<span class="ct">'+n+'</span>');
    b.addEventListener('click',function(){
      fStatus=k;tabs.forEach(function(x){x.setAttribute('aria-pressed',x===b)});applyFilters();
    });
  });
  var topicRow=d.getElementById('topics');
  if(topicRow){
    TOPICS.forEach(function(t){
      var n=t[0]==='all'?pubs.length:Array.prototype.filter.call(pubs,function(p){return hasTopic(p,t[0])}).length;
      var b=d.createElement('button');b.type='button';b.className='topic';b.setAttribute('aria-pressed',t[0]==='all');
      b.appendChild(d.createTextNode(t[1]));
      var c=d.createElement('span');c.className='ct';c.textContent=n;b.appendChild(c);
      b.addEventListener('click',function(){
        fTopic=t[0];topicRow.querySelectorAll('.topic').forEach(function(x){x.setAttribute('aria-pressed',x===b)});applyFilters();
      });
      topicRow.appendChild(b);
    });
  }

  // citation buttons: APA (copied with italics, so it pastes cleanly into Word or Docs) and BibTeX
  var CITES={};try{CITES=JSON.parse(d.getElementById('cites').textContent)}catch(e){}
  var live=d.getElementById('live');
  function initials(first){
    return first.split(/\s+/).filter(function(t){return t&&t.indexOf('/')<0}).map(function(t){
      return t.split('-').map(function(x){return x.charAt(0).toUpperCase()+'.'}).join('-');
    }).join(' ');
  }
  function apaAuthors(a){
    var l=a.map(function(p){return p[0]+', '+initials(p[1])});
    return l.length<2?l[0]:l.length===2?l[0]+', & '+l[1]:l.slice(0,-1).join(', ')+', & '+l[l.length-1];
  }
  var DEPT='Department of Curriculum & Teaching, University of Kansas';
  // Built to APA 7: article titles in sentence case, journal and volume in italics, DOI as a full link,
  // "Advance online publication." for an article that has no issue yet, page ranges with an en dash;
  // a manuscript under review is cited by status only (italic title, no journal, department and university);
  // a preprint has an italic title and the server name, with no bracketed label.
  function apa(r){
    var it=function(x){return '<i>'+x+'</i>'},au=apaAuthors(r.a),s;
    if(r.kind==='article'){
      s=au+' ('+r.y+'). '+r.t+'. '+it(r.v);
      if(r.vol)s+=', '+it(r.vol)+(r.iss?'('+r.iss+')':'');
      if(r.pp)s+=', '+r.pp.replace('-','\u2013');
      if(r.art)s+=', Article '+r.art;
      s+='.';
      if(r.online)s+=' Advance online publication.';
    }else if(r.kind==='submitted'){
      s=au+' ('+r.y+'). '+it(r.t)+' [Manuscript submitted for publication]. '+DEPT+'.';
    }else if(r.kind==='talk'){
      s=au+' ('+r.y+', '+r.date+'). '+it(r.t)+' ['+r.fmt+']. '+r.v+', '+r.loc+'.';
    }else{
      s=au+' ('+r.y+'). '+it(r.t)+'. '+r.v+'.';
    }
    var link=r.doi?'https://doi.org/'+r.doi:(r.url||'');
    if(link)s+=' '+link;
    // the only tags in s are the <i> pairs added above, so escaping every ampersand is safe
    return {html:s.replace(/&/g,'&amp;'),text:s.replace(/<[^>]+>/g,'')};
  }
  var ACC={'á':"{\\'a}",'é':"{\\'e}",'í':"{\\'i}",'ó':"{\\'o}",'ú':"{\\'u}",'ñ':'{\\~n}'};
  function tex(s){return s.replace(/&/g,'\\&').replace(/"([^"]*)"/g,"``$1''").replace(/[áéíóúñ]/g,function(c){return ACC[c]})}
  function bibtex(r){
    var au=r.a.map(function(p){return tex(p[0])+', '+tex(p[1])}).join(' and '),f=['author = {'+au+'}','title = {{'+tex(r.t)+'}}'],type='article';
    if(r.kind==='article'){
      f.push('journal = {'+tex(r.v)+'}','year = {'+r.y+'}');
      if(r.vol)f.push('volume = {'+r.vol+'}');
      if(r.iss)f.push('number = {'+r.iss+'}');
      if(r.pp)f.push('pages = {'+r.pp.replace('-','--')+'}');
      if(r.art)f.push('eid = {'+r.art+'}');
      if(r.online)f.push('note = {Advance online publication}');
    }else if(r.kind==='submitted'){
      type='unpublished';f.push('note = {Manuscript submitted for publication}','year = {'+r.y+'}');
    }else if(r.kind==='talk'){
      type='inproceedings';f.push('booktitle = {'+tex(r.bt)+'}','year = {'+r.y+'}','month = '+r.month,'address = {Los Angeles, CA}','note = {Paper presented at the '+tex(r.v)+', '+r.date+', '+r.y+'}');
    }else{
      type='misc';f.push('year = {'+r.y+'}');
      if(r.kind==='preprint')f.push('howpublished = {'+tex(r.v)+'}');else f.push('note = {Reproducible research artifact}');
      if(r.eprint)f.push('eprint = {'+r.eprint+'}','archivePrefix = {arXiv}');
    }
    if(r.doi)f.push('doi = {'+r.doi+'}');else if(r.url)f.push('url = {'+r.url+'}');
    return '@'+type+'{'+r.key+',\n  '+f.join(',\n  ')+'\n}';
  }
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
    return new Promise(function(res,rej){
      var ta=d.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';d.body.appendChild(ta);ta.select();
      try{d.execCommand('copy')?res():rej()}catch(e){rej(e)}ta.remove();
    });
  }
  function copyRich(html,text){
    if(navigator.clipboard&&window.ClipboardItem){
      return navigator.clipboard.write([new ClipboardItem({'text/html':new Blob(['<p style="margin:0 0 0 0.5in;text-indent:-0.5in">'+html+'</p>'],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]).catch(function(){return copyText(text)});
    }
    return copyText(text);
  }
  d.querySelectorAll('.pub[data-id],.row[data-id]').forEach(function(p){
    var r=CITES[p.dataset.id];if(!r)return;
    var bar=d.createElement('div');bar.className='cite';
    [['Copy APA','apa'],['BibTeX','bib']].forEach(function(spec){
      var b=d.createElement('button');b.type='button';b.className='cbtn';b.textContent=spec[0];
      b.setAttribute('aria-label',spec[1]==='apa'?'Copy APA citation':'Copy BibTeX entry');
      b.addEventListener('click',function(){
        var job=spec[1]==='apa'?(function(){var c=apa(r);return copyRich(c.html,c.text)})():copyText(bibtex(r));
        job.then(function(){
          b.classList.add('ok');b.textContent='Copied';if(live)live.textContent=(spec[1]==='apa'?'APA citation':'BibTeX entry')+' copied';
          setTimeout(function(){b.classList.remove('ok');b.textContent=spec[0]},1800);
        },function(){b.textContent='Press Ctrl+C';setTimeout(function(){b.textContent=spec[0]},1800)});
      });
      bar.appendChild(b);
    });
    (p.classList.contains('pub')?p.lastElementChild:p.querySelector('.t')).appendChild(bar);
  });

  // full-screen menu on small screens
  var btn=d.getElementById('menu'),sheet=d.getElementById('sheet');
  function setMenu(open){
    sheet.classList.toggle('open',open);nav.classList.toggle('open',open);
    btn.setAttribute('aria-expanded',open);btn.firstElementChild.textContent=open?'Close':'Menu';
    d.body.style.overflow=open?'hidden':'';
  }
  btn.addEventListener('click',function(){setMenu(!sheet.classList.contains('open'))});
  sheet.addEventListener('click',function(e){if(e.target.closest('a'))setMenu(false)});
  addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});
  addEventListener('resize',function(){if(innerWidth>820)setMenu(false)});

  // mark the section currently in view
  var links={};
  d.querySelectorAll('nav ul a,.sheet a').forEach(function(a){var id=a.getAttribute('href').slice(1);(links[id]=links[id]||[]).push(a)});
  var spy=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      Object.keys(links).forEach(function(k){links[k].forEach(function(a){
        if(k===e.target.id)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');
      })});
    });
  },{rootMargin:'-45% 0px -50% 0px'});
  d.querySelectorAll('header.hero,section').forEach(function(s){spy.observe(s)});
})();

// ---------------------------------------------------------------- shared helpers
function clamp(v,a,b){return v<a?a:v>b?b:v}
function smooth(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)}
function fitCanvas(c,ctx,w,h,maxPx){
  var d=Math.max(1,Math.min(devicePixelRatio||1,Math.sqrt(maxPx/Math.max(1,w*h))));   // cap the pixel count
  c.width=Math.round(w*d);c.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);return d;
}
function placeTip(tip,box,x,y){
  tip.style.display='block';
  var w=tip.offsetWidth,h=tip.offsetHeight,bw=box.clientWidth,bh=box.clientHeight;
  var l=x+16,t=y+16;if(l+w>bw-8)l=x-w-16;if(t+h>bh-8)t=y-h-16;
  tip.style.left=Math.max(8,l)+'px';tip.style.top=Math.max(8,t)+'px';
}

// ================================================================ Hero: a live mel spectrogram
// It scrolls the way a real speech analyser does. The speech is synthesised on the fly: voiced
// vowels (a harmonic comb under moving formants), fricative noise, stop closures and bursts,
// nasals, and pauses between phrases. The cursor works as a listener: it reads out the frequency
// and names what is under it. Three tags at the right edge follow the live formants.
// Kept cheap: one small canvas that is shifted and extended a column at a time, one overlay for
// the labels, and it sleeps completely when off screen or in a hidden tab.
(function(){
  var viz=document.getElementById('vizA'),spec=document.getElementById('spec'),ov=document.getElementById('ovA'),tip=document.getElementById('tipA');
  if(!viz)return;
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sx=spec.getContext('2d'),ox=ov.getContext('2d');
  var NB=120,FMAX=8000,CPS=60,SC=2,RING=4096;
  function mel(f){return 2595*Math.log10(1+f/700)}
  function imel(m){return 700*(Math.pow(10,m/2595)-1)}
  var MM=mel(FMAX),FREQ=new Float32Array(NB);for(var i=0;i<NB;i++)FREQ[i]=imel(i/(NB-1)*MM);

  // colour ramp: black, deep umber, gold, pale gold
  var LUT=new Uint8Array(256*3),stops=[[0,10,10,10],[.16,28,21,9],[.38,82,64,29],[.60,148,120,64],[.78,203,170,102],[.92,240,214,150],[1,255,246,220]];
  for(var i=0;i<256;i++){var v=i/255,k=0;while(k<stops.length-2&&v>stops[k+1][0])k++;var a=stops[k],b=stops[k+1],t=(v-a[0])/(b[0]-a[0]);
    for(var c=0;c<3;c++)LUT[i*3+c]=a[c+1]+(b[c+1]-a[c+1])*t}

  // ---- speech synthesiser ----
  var VOW={a:[730,1090,2440],e:[530,1840,2480],i:[270,2290,3010],o:[570,840,2410],u:[300,870,2240],x:[660,1720,2410]},VK=Object.keys(VOW);
  var queue=[],cur=null,curT=0,segId=0,segs={};
  var S={F:[500,1500,2500],Ft:[500,1500,2500],f0:125,v:0,vT:0,nz:0,nzT:0,lo:3000,hi:7600,phrase:0,phraseTot:1};
  var TYPE={pause:0,vowel:1,fric:2,burst:3,nasal:4,stop:5,asp:6};
  function pushPhrase(){
    var n=3+Math.floor(Math.random()*4);
    for(var s=0;s<n;s++){
      var r=Math.random();
      if(r<.20){queue.push({type:'stop',dur:.06+.03*Math.random()});queue.push({type:'burst',dur:.014});queue.push({type:'asp',dur:.03})}
      else if(r<.42)queue.push({type:'fric',dur:.09+.07*Math.random(),lo:3000+Math.random()*1500,hi:7700});
      else if(r<.56)queue.push({type:'nasal',dur:.07+.04*Math.random()});
      queue.push({type:'vowel',v:VK[Math.floor(Math.random()*VK.length)],dur:.15+.13*Math.random(),acc:Math.random()<.35});
      if(Math.random()<.2)queue.push({type:'nasal',dur:.06});
    }
    queue.push({type:'pause',dur:.28+.42*Math.random()});
    var tot=0;for(var q=0;q<queue.length;q++)tot+=queue[q].dur;S.phrase=0;S.phraseTot=tot;
  }
  function stepSynth(dt){
    if(!cur||curT>=cur.dur){
      if(!queue.length)pushPhrase();
      cur=queue.shift();curT=0;cur.id=++segId;segs[cur.id]=cur;delete segs[cur.id-400];
    }
    curT+=dt;S.phrase+=dt;
    switch(cur.type){
      case 'vowel':S.Ft=VOW[cur.v];S.vT=cur.acc?1:.78;S.nzT=0;break;
      case 'fric':S.vT=0;S.nzT=.55;S.lo=cur.lo;S.hi=cur.hi;break;
      case 'burst':S.vT=0;S.nzT=.62;S.lo=1800;S.hi=6200;break;
      case 'asp':S.vT=0;S.nzT=.2;S.lo=1200;S.hi=5200;break;
      case 'nasal':S.vT=.42;S.nzT=0;S.Ft=[260,1250,2500];break;
      default:S.vT=0;S.nzT=0;
    }
    var kf=1-Math.exp(-dt/.04);for(var k=0;k<3;k++)S.F[k]+=(S.Ft[k]-S.F[k])*kf;
    S.v+=(S.vT-S.v)*(1-Math.exp(-dt/(S.vT>S.v?.02:.05)));
    S.nz+=(S.nzT-S.nz)*(1-Math.exp(-dt/.012));
    var p=Math.min(1,S.phrase/S.phraseTot);
    S.f0=128*(1-.22*p)*(1+(cur.acc?.08:0))*(1+.012*Math.sin(S.phrase*7));
  }

  // ---- column history ----
  var H1=new Float32Array(RING),H2=new Float32Array(RING),H3=new Float32Array(RING),H0=new Float32Array(RING),HV=new Float32Array(RING);
  var HK=new Uint8Array(RING),HS=new Int32Array(RING),col=0,colBuf=new Uint8Array(NB);
  var BW=[95,130,190];
  function makeColumn(){
    stepSynth(1/CPS);
    var F=S.F,v=S.v,nz=S.nz,f0=S.f0,lo=S.lo,hi=S.hi,idx=col%RING;
    for(var i=0;i<NB;i++){
      var f=FREQ[i],I=0;
      if(v>.01){
        var env=.16*Math.exp(-f/2600);
        for(var k=0;k<3;k++){var d=(f-F[k])/BW[k];env+=(k===0?1:k===1?.82:.55)*Math.exp(-d*d)}
        var cm=Math.cos(6.2831853*f/f0),peak=cm>0?Math.pow(cm,6):0,ct=clamp(1.1-f/3200,.12,1);
        I+=v*env*(.22+.78*(ct*peak+(1-ct)*.45));
      }
      if(nz>.01){
        var band=smooth(lo*.8,lo,f)*(1-smooth(hi,hi*1.1,f));
        I+=nz*band*(.5+.5*Math.random());
      }
      I=I*.92+.018*Math.random();
      colBuf[i]=Math.pow(clamp(I,0,1),.62)*255|0;
    }
    H1[idx]=F[0];H2[idx]=F[1];H3[idx]=F[2];H0[idx]=f0;HV[idx]=v;HK[idx]=TYPE[cur.type];HS[idx]=cur.id;
    col++;
  }
  var BW_=0,W=0,H=0,lastW=0,acc=0,last=0,raf=0,running=false,vis=true,px=-1,py=-1;
  function pushColumns(n){
    var img=sx.createImageData(n,NB),pd=img.data;
    for(var c=0;c<n;c++){
      makeColumn();
      for(var i=0;i<NB;i++){var y=NB-1-i,o=(y*n+c)*4,l=colBuf[i]*3;pd[o]=LUT[l];pd[o+1]=LUT[l+1];pd[o+2]=LUT[l+2];pd[o+3]=255}
    }
    if(n<BW_)sx.drawImage(spec,n,0,BW_-n,NB,0,0,BW_-n,NB);
    sx.putImageData(img,BW_-n,0);
  }

  // ---- labels drawn over the spectrogram ----
  function yOf(f){return H*(1-mel(f)/MM)}
  function xOfCol(c){return W-(col-1-c)*SC}
  function fmtHz(f){return f>=1000?(f/1000).toFixed(f>=10000?0:2).replace(/\.?0+$/,'')+' kHz':Math.round(f)+' Hz'}
  var AX=[250,500,1000,2000,4000,8000];   // 100 Hz is left out: it would sit on top of the time axis
  function drawOverlay(){
    if(!W)return;
    ox.clearRect(0,0,W,H);
    ox.font='500 10px "Instrument Sans",sans-serif';ox.textBaseline='middle';
    var padL=Math.max(16,(W-1180)/2+Math.min(64,W*.05)),axX=W>700?22:12;   // legend lines up with the page column; the frequency axis sits at the left edge
    for(var k=0;k<AX.length;k++){                                     // frequency axis
      var y=yOf(AX[k]);if(y<14||y>H-10)continue;
      ox.strokeStyle='rgba(236,231,220,.10)';ox.beginPath();ox.moveTo(0,y);ox.lineTo(W,y);ox.stroke();
      ox.textAlign='left';var lab=fmtHz(AX[k]).toUpperCase(),tw=ox.measureText(lab).width;
      ox.fillStyle='rgba(10,10,10,.62)';ox.fillRect(axX-5,y-8,tw+10,16);
      ox.fillStyle='rgba(236,231,220,.55)';ox.fillText(lab,axX,y);
    }
    ox.textAlign='center';                                            // time axis: a tick every second
    var c0=col-1-Math.floor(W/SC);c0=c0-(c0%CPS);
    for(var c=c0;c<col;c+=CPS){
      if(c<0)continue;var x=xOfCol(c);if(x<92||x>W-40)continue;
      ox.strokeStyle='rgba(236,231,220,.18)';ox.beginPath();ox.moveTo(x,H-14);ox.lineTo(x,H-6);ox.stroke();
      ox.fillStyle='rgba(236,231,220,.4)';ox.fillText('-'+Math.round((col-1-c)/CPS)+' s',x,H-20);
    }
    var firstCol=Math.max(0,col-Math.floor(W/SC)),run=-1;            // pause brackets
    for(var c=firstCol;c<=col;c++){
      var idx=c%RING,isP=c<col&&HK[idx]===0&&segs[HS[idx]]&&segs[HS[idx]].type==='pause';
      if(isP&&run<0)run=c;
      if((!isP||c===col)&&run>=0){
        var dur=(c-run)/CPS,x1=xOfCol(run),x2=xOfCol(c-1);
        if(dur>=.24&&x2-x1>30&&x1>110&&x2<W-30){
          var yb=H-34;ox.strokeStyle='rgba(214,184,122,.55)';ox.beginPath();ox.moveTo(x1,yb-4);ox.lineTo(x1,yb);ox.lineTo(x2,yb);ox.lineTo(x2,yb-4);ox.stroke();
          ox.fillStyle='rgba(214,184,122,.85)';ox.fillText('PAUSE '+Math.round(dur*1000)+' MS',(x1+x2)/2,yb-12);
        }
        run=-1;
      }
    }
    var li=(col-1)%RING,vv=clamp(HV[li]*1.3,0,1);                     // live formant tags
    if(vv>.08){
      ox.textAlign='right';var F=[H1[li],H2[li],H3[li]];
      for(var k=0;k<3;k++){
        var y=yOf(F[k]),a=vv*(k===0?1:.85);
        ox.fillStyle='rgba(214,184,122,'+a.toFixed(2)+')';ox.beginPath();ox.arc(W-8,y,2.4,0,6.283);ox.fill();
        var lab='F'+(k+1)+'  '+Math.round(F[k]),tw=ox.measureText(lab).width;
        ox.fillStyle='rgba(10,10,10,'+(a*.6).toFixed(2)+')';ox.fillRect(W-20-tw-4,y-8,tw+8,16);
        ox.fillStyle='rgba(236,231,220,'+(a*.9).toFixed(2)+')';ox.fillText(lab,W-20,y);
      }
    }
    ox.textAlign='left';ox.fillStyle='rgba(185,154,91,.9)';ox.fillText('MEL SPECTROGRAM',padL,32);
    ox.fillStyle='rgba(236,231,220,.42)';ox.fillText(W>640?'LIVE · 0 TO 8 KHZ · SIMULATED SPEECH':'LIVE · SIMULATED',padL+112,32);
    if(px>=0&&px<=W&&py>=0&&py<=H){                                   // the listener
      ox.strokeStyle='rgba(214,184,122,.7)';ox.beginPath();ox.moveTo(px,0);ox.lineTo(px,H);ox.moveTo(0,py);ox.lineTo(W,py);ox.stroke();
      readout();
    }else tip.style.display='none';
  }
  function readout(){
    var c=col-1-Math.round((W-px)/SC);if(c<0||c>=col){tip.style.display='none';return}
    var idx=c%RING,f=imel((1-py/H)*MM),kind=HK[idx],seg=segs[HS[idx]],ago=((col-1-c)/CPS).toFixed(1),what='';
    if(kind===1||kind===4){
      var F=[H1[idx],H2[idx],H3[idx]],hit=-1;
      for(var k=0;k<3;k++)if(Math.abs(f-F[k])<F[k]*.13)hit=k;
      if(hit>=0)what='<i>F'+(hit+1)+'</i> formant, <em>'+Math.round(F[hit])+' Hz</em>';
      else if(f<H0[idx]*1.5)what='<i>pitch</i> (f0), <em>'+Math.round(H0[idx])+' Hz</em>';
      else what='<i>harmonic '+Math.max(2,Math.round(f/H0[idx]))+'</i> of '+Math.round(H0[idx])+' Hz';
      what=(kind===4?'nasal · ':'vowel · ')+what;
    }else if(kind===2)what='<i>fricative</i> noise';
    else if(kind===3||kind===6)what='<i>stop burst</i>';
    else if(kind===5)what='<i>stop closure</i> (silence)';
    else what='<i>pause</i>'+(seg?', '+Math.round(seg.dur*1000)+' ms':'');
    tip.innerHTML='<b>'+fmtHz(f)+' · '+ago+' s ago</b>'+what;
    placeTip(tip,viz,px,py);
  }

  // ---- sizing: a new buffer only when the width changes, so a phone's collapsing address bar never resets it ----
  function layout(force){
    var w=viz.clientWidth,h=viz.clientHeight;if(!w||!h)return;
    W=w;H=h;
    if(force||w!==lastW){
      lastW=w;BW_=Math.max(120,Math.round(W/SC));spec.width=BW_;spec.height=NB;
      sx.fillStyle='#0a0a0a';sx.fillRect(0,0,BW_,NB);
      var rest=BW_;while(rest>0){var n=Math.min(rest,64);pushColumns(n);rest-=n}   // pre-roll so it is full from the first frame
    }
    fitCanvas(ov,ox,W,H,2.2e6);
    drawOverlay();
  }
  function frame(ts){
    if(!running)return;
    var dt=Math.min((ts-last)/1000,.1);last=ts;acc+=dt*CPS;
    var n=Math.floor(acc);acc-=n;
    if(n>0){pushColumns(Math.min(n,12))}
    drawOverlay();
    raf=requestAnimationFrame(frame);
  }
  function start(){if(running||RM||document.hidden||!vis)return;running=true;last=performance.now();raf=requestAnimationFrame(frame)}
  function stop(){running=false;cancelAnimationFrame(raf)}
  viz.addEventListener('pointermove',function(e){var r=viz.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top;if(!running)drawOverlay()},{passive:true});
  viz.addEventListener('pointerleave',function(){px=py=-1;tip.style.display='none';if(!running)drawOverlay()});
  new ResizeObserver(function(){layout(false)}).observe(viz);
  layout(true);
  new IntersectionObserver(function(es){vis=es[0].isIntersecting;vis?start():stop()}).observe(viz);   // no work while off screen
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
  start();
})();

// ================================================================ Research: two scorers, one question
// A stream of spoken responses. For each one a human rater gives a score (gold line) and an
// automated scorer gives its own (ivory line). Most of the time they track each other; every so
// often the machine departs from the human for a few responses. The dashed cut score decides
// pass or fail, so what matters is not just any gap but a gap that puts the two on opposite sides
// of that line ("decision flips"). An illustration of the question, not study data.
(function(){
  var box=document.getElementById('vizB'),cv=document.getElementById('scope'),tip=document.getElementById('tipB');
  if(!box)return;
  var ctx=cv.getContext('2d'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SPEED=70,DT=.85,CUT=3.5,PT=70,PB=40,PR=104,W=0,H=0,running=false,vis=true,raf=0,px=-1,py=-1,staticNow=performance.now()/1000;
  var S=[],hPrev=3.7,epiLeft=0,epiDev=0,nextEpi=4,seq=0;
  function randn(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*v)}
  function gen(t){
    hPrev=3.65+.8*(hPrev-3.65)+randn()*.5;hPrev=clamp(hPrev,1.4,5.7);
    if(epiLeft<=0&&--nextEpi<=0){
      epiLeft=2+Math.floor(Math.random()*3);nextEpi=4+Math.floor(Math.random()*5);
      var side=Math.random()<.78?(hPrev>CUT?-1:1):(Math.random()<.5?-1:1);
      epiDev=side*(.9+Math.random()*.7);
    }
    var dev=0;if(epiLeft>0){dev=epiDev*(.75+.25*Math.random());epiLeft--}
    var m=clamp(hPrev+dev+randn()*.16,1,6);
    S.push({t:t,h:hPrev,m:m,flip:(hPrev>=CUT)!==(m>=CUT),id:seq++});
  }
  function fill(now){
    var span=W/SPEED+4*DT;
    if(!S.length){var t=now-span;while(t<=now+3*DT){gen(t);t+=DT}}
    else{var l=S[S.length-1].t;while(l<now+3*DT){l+=DT;gen(l)}}
    while(S.length>6&&S[1].t<now-span)S.shift();
  }
  function cr(p0,p1,p2,p3,t){return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t)}   // Catmull-Rom
  function at(tau,key){
    var f=(tau-S[0].t)/DT,i=Math.floor(f),t=f-i,n=S.length;
    var g=function(j){return S[clamp(j,0,n-1)][key]};
    return cr(g(i-1),g(i),g(i+1),g(i+2),t);
  }
  function yOf(s){return PT+(6-s)/5*(H-PT-PB)}
  function size(){
    var w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;
    W=w;H=h;PR=W<520?88:104;SPEED=W<520?44:70;fitCanvas(cv,ctx,W,H,2.2e6);S=[];
    if(!running)draw(staticNow);
  }
  var STEP=3;
  function draw(now){
    if(!W||!H)return;
    fill(now);
    ctx.clearRect(0,0,W,H);
    var xR=W-PR,xL=Math.max(52,(W-1180)/2+Math.min(64,W*.05)),padL=xL-30;
    if(xR-xL<80)return;                                               // too narrow to draw (a hidden or tiny container)
    var tauOf=function(x){return now-(xR-x)/SPEED};
    ctx.font='500 10px "Instrument Sans",sans-serif';ctx.textBaseline='middle';
    if('letterSpacing' in ctx)ctx.letterSpacing='1px';

    ctx.textAlign='left';                                             // grid and score scale
    for(var s=1;s<=6;s++){
      var y=yOf(s);ctx.strokeStyle='rgba(236,231,220,'+(s===1||s===6?.12:.07)+')';ctx.beginPath();ctx.moveTo(xL,y);ctx.lineTo(xR,y);ctx.stroke();
      ctx.fillStyle='rgba(236,231,220,.42)';ctx.fillText(String(s),xL-16,y);
    }
    ctx.save();ctx.translate(xL-34,yOf(3.5));ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillStyle='rgba(236,231,220,.34)';ctx.fillText('SCORE',0,0);ctx.restore();
    var yc=yOf(CUT);ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(214,184,122,.6)';ctx.beginPath();ctx.moveTo(xL,yc);ctx.lineTo(xR,yc);ctx.stroke();ctx.setLineDash([]);

    var n=Math.floor((xR-xL)/STEP)+1,xs=new Float32Array(n),hs=new Float32Array(n),ms=new Float32Array(n);
    for(var k=0;k<n;k++){var x=xL+k*STEP,tau=tauOf(x);xs[k]=x;hs[k]=yOf(at(tau,'h'));ms[k]=yOf(at(tau,'m'))}

    for(var k=0;k<n-1;k++){                                           // the area between the traces, gold where the decision flips
      var hm=(hs[k]+hs[k+1])/2,mm=(ms[k]+ms[k+1])/2,gap=Math.abs(hm-mm)/(H-PT-PB)*5;
      var fl=(hm-yc)*(mm-yc)<0,edge=smooth(xL,xL+60,xs[k])*smooth(xR+2,xR-40,xs[k]);
      ctx.fillStyle=fl?'rgba(214,184,122,'+(.34*edge).toFixed(3)+')':'rgba(236,231,220,'+((.04+.13*Math.min(1,gap))*edge).toFixed(3)+')';
      ctx.beginPath();ctx.moveTo(xs[k],hs[k]);ctx.lineTo(xs[k+1],hs[k+1]);ctx.lineTo(xs[k+1],ms[k+1]);ctx.lineTo(xs[k],ms[k]);ctx.closePath();ctx.fill();
    }
    function trace(arr,color,w,halo){
      ctx.lineJoin='round';
      ctx.beginPath();for(var k=0;k<n;k++)k?ctx.lineTo(xs[k],arr[k]):ctx.moveTo(xs[k],arr[k]);
      ctx.strokeStyle=halo;ctx.lineWidth=w*4;ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();
    }
    trace(ms,'rgba(236,231,220,.9)',1.5,'rgba(236,231,220,.07)');
    trace(hs,'#d6b87a',2.1,'rgba(214,184,122,.10)');
    for(var i=0;i<S.length;i++){                                      // a dot for every response
      var x=xR-(now-S[i].t)*SPEED;if(x<xL+4||x>xR)continue;
      ctx.fillStyle='#0a0a0a';
      ctx.beginPath();ctx.arc(x,yOf(S[i].h),2.8,0,6.283);ctx.fill();ctx.strokeStyle='#d6b87a';ctx.lineWidth=1.2;ctx.stroke();
      ctx.beginPath();ctx.arc(x,yOf(S[i].m),2.6,0,6.283);ctx.fill();ctx.strokeStyle='rgba(236,231,220,.9)';ctx.stroke();
    }
    var i=0;ctx.textAlign='center';                                   // one flag per run of flips
    while(i<S.length){
      if(!S[i].flip){i++;continue}
      var j=i;while(j+1<S.length&&S[j+1].flip)j++;
      var tc=(S[i].t+S[j].t)/2,x=xR-(now-tc)*SPEED;
      if(x>xL+60&&x<xR-30){
        var a=smooth(xL+50,xL+170,x)*smooth(xR-30,xR-110,x),top=Math.min(yOf(at(tc,'h')),yOf(at(tc,'m'))),yy=Math.max(PT-6,top-26);
        ctx.strokeStyle='rgba(214,184,122,'+(a*.6).toFixed(2)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yy+8);ctx.lineTo(x,top-4);ctx.stroke();
        ctx.fillStyle='rgba(214,184,122,'+(a*.95).toFixed(2)+')';ctx.fillText('DECISION FLIPS',x,yy);
      }
      i=j+1;
    }
    ctx.strokeStyle='rgba(236,231,220,.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(xR,PT-14);ctx.lineTo(xR,H-PB+10);ctx.stroke();   // live edge
    var hN=at(now,'h'),mN=at(now,'m'),yh=yOf(hN),ym=yOf(mN);
    ctx.fillStyle='#d6b87a';ctx.beginPath();ctx.arc(xR,yh,3.6,0,6.283);ctx.fill();
    ctx.fillStyle='#ece7dc';ctx.beginPath();ctx.arc(xR,ym,3.2,0,6.283);ctx.fill();
    var yh2=yh,ym2=ym;if(Math.abs(yh2-ym2)<26){var mid=(yh2+ym2)/2,sg=yh2<ym2?-1:1;yh2=mid+sg*13;ym2=mid-sg*13}
    ctx.textAlign='left';ctx.fillStyle='#d6b87a';ctx.fillText('HUMAN '+hN.toFixed(1),xR+16,yh2);
    ctx.fillStyle='rgba(236,231,220,.92)';ctx.fillText('AUTO '+mN.toFixed(1),xR+16,ym2);
    var lx=padL,ly=28;                                                // legend
    ctx.fillStyle='#d6b87a';ctx.fillRect(lx,ly-1,18,2);ctx.fillText('HUMAN RATERS',lx+26,ly);
    ctx.fillStyle='rgba(236,231,220,.9)';ctx.fillRect(lx+142,ly-1,18,2);ctx.fillText('AUTOMATED SCORER',lx+168,ly);
    if(lx+440<W){ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(214,184,122,.7)';ctx.beginPath();ctx.moveTo(lx+320,ly);ctx.lineTo(lx+338,ly);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(214,184,122,.85)';ctx.fillText('CUT SCORE',lx+346,ly)}

    if(px>=xL&&px<=xR&&py>=0&&py<=H){                                 // the listener
      var tau=tauOf(px),h=at(tau,'h'),m=at(tau,'m'),flip=(h>=CUT)!==(m>=CUT);
      ctx.strokeStyle='rgba(214,184,122,.65)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px,PT-14);ctx.lineTo(px,H-PB+10);ctx.stroke();
      ctx.fillStyle='#d6b87a';ctx.beginPath();ctx.arc(px,yOf(h),3.8,0,6.283);ctx.fill();
      ctx.fillStyle='#ece7dc';ctx.beginPath();ctx.arc(px,yOf(m),3.4,0,6.283);ctx.fill();
      tip.innerHTML='<b>Response · '+Math.max(0,Math.round((now-tau)/DT))+' ago</b>Human <i>'+h.toFixed(1)+'</i><br>Automated <i>'+m.toFixed(1)+'</i><br>Difference <em>'+Math.abs(h-m).toFixed(1)+'</em>'+(flip?'<br><em>Decision flips at the cut score</em>':'<br>Same side of the cut score');
      placeTip(tip,box,px,py);
    }else tip.style.display='none';
  }
  function frame(){if(!running)return;draw(performance.now()/1000);raf=requestAnimationFrame(frame)}
  function start(){if(running||RM||document.hidden||!vis)return;running=true;raf=requestAnimationFrame(frame)}
  function stop(){running=false;cancelAnimationFrame(raf)}
  box.addEventListener('pointermove',function(e){var r=box.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top;if(!running)draw(staticNow)},{passive:true});
  box.addEventListener('pointerleave',function(){px=py=-1;tip.style.display='none';if(!running)draw(staticNow)});
  new ResizeObserver(size).observe(box);
  size();
  new IntersectionObserver(function(es){vis=es[0].isIntersecting;vis?start():stop()}).observe(box);   // no work while off screen
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
  start();
})();
</script>
</body>
