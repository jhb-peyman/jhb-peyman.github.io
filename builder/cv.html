<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@@TITLE@@</title>
<meta name="author" content="@@AUTHOR@@">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
@page{
  size:Letter;
  margin:.6in .72in .8in;
  @bottom-center{content:"@@FOOTER@@" counter(page);font:9pt 'Caladea',serif;color:#5C6975}
}
*{box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:10pt/1.2 'Caladea',Cambria,Georgia,serif;color:#202124}
a{color:inherit;text-decoration:none}
b,strong{font-weight:700}
i,em{font-style:italic}

header.top{text-align:center;margin:0 0 14pt}
header.top h1{margin:0;font:700 27pt/1.15 'Caladea',serif;color:#1F4E79}
.sub{margin-top:3pt;font-size:11pt}
.contact{margin-top:2pt;font-size:10pt;color:#5C6975}
.contact .sep{margin:0 7pt}

h2{margin:12pt 0 6pt;padding-bottom:2pt;border-bottom:1.2pt solid #B9C6D8;font:700 11.5pt/1.2 'Caladea',serif;letter-spacing:.005em;text-transform:uppercase;color:#1F4E79;break-after:avoid}
header.top + h2{margin-top:0}
h3.grp{margin:8pt 0 3pt;font:700 10.5pt/1.2 'Caladea',serif;text-transform:uppercase;color:#1F4E79;break-after:avoid}

p{margin:0}
.ent{margin:0 0 5pt;break-inside:avoid}
.r1,.r2{display:flex;justify-content:space-between;align-items:baseline;gap:18pt}
.r1 .l{font-weight:700;font-size:10.5pt}
.r1 .d{font-weight:700;white-space:nowrap;text-align:right}
.r2{color:#5C6975;font-style:italic;font-size:9.5pt}
.r2 .p{white-space:nowrap}
.ent p{margin-top:1pt}
.ent .th{font-style:italic}

.pub{margin:0 0 5pt;break-inside:avoid}
.pub .t{font-weight:700;font-size:10.5pt}
.pub .au{margin-top:1pt}
.pub .vn{margin-top:1pt;color:#5C6975;font-size:9.5pt}
.pub .vn i{font-style:italic}
.pub .vn a{color:#1F4E79}

ul.b{margin:0;padding:0;list-style:none}
ul.b li{position:relative;margin:0 0 2pt;padding-left:12pt;break-inside:avoid}
ul.b li::before{content:"\2022";position:absolute;left:1pt}

.crs{display:flex;justify-content:space-between;align-items:baseline;gap:16pt;margin:0 0 3pt;break-inside:avoid}
.crs .n{flex:1;padding-left:3pt;font-weight:400}
.crs .n b{margin-right:4pt}
.crs .tm{color:#5C6975;text-align:right;white-space:nowrap}
.tsum{margin:0 0 3pt;color:#5C6975;font-style:italic;font-size:9.5pt}
.tuni{font-weight:700;font-size:10.5pt}

.hon{margin:0 0 1pt}
.langs b{font-weight:700}
.langs .sep{margin:0 6pt}
</style>
</head>
<body>
@@BODY@@
</body>
</html>
