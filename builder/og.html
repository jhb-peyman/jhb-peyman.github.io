<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Albert+Sans:ital,wght@0,400;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#ffffff;width:1200px;height:630px;overflow:hidden}
.c{position:absolute;left:96px;top:0;bottom:0;right:96px;display:grid;grid-template-columns:250px 1fr;gap:64px;align-items:center}
img{width:250px;height:250px;border-radius:50%;object-fit:cover;object-position:50% 22%;box-shadow:0 0 0 1px #e5e7ea}
h1{margin:0;font:600 70px/1.05 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:-.02em;color:#1b1f23}
.r{margin-top:16px;font:400 25px/1.4 'Albert Sans',system-ui,sans-serif;color:#767d85}
p{margin:30px 0 0;font:400 36px/1.35 'Albert Sans',system-ui,sans-serif;color:#1b1f23}
p em{font-style:italic}
.b{position:absolute;left:0;right:0;bottom:0;height:10px;background:#1d6b4a}
.u{position:absolute;right:96px;bottom:36px;font:500 20px 'IBM Plex Mono',monospace;color:#1d6b4a}
</style></head><body>
<div class="c"><img src="@@PORTRAIT@@" alt="">
<div><h1>@@NAME@@</h1><div class="r">@@ROLE@@</div><p>@@LINE@@</p></div></div>
<div class="u">@@URL@@</div><div class="b"></div>
</body></html>
