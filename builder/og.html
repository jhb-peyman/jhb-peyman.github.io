<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;background:#0a0a0a;width:1200px;height:630px;overflow:hidden}
.c{position:absolute;left:84px;top:50px;color:#ece7dc}
.k{font:500 15px 'Instrument Sans',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:#b99a5b;display:flex;align-items:center;gap:20px}
.k::before{content:"";width:52px;height:1px;background:#b99a5b}
h1{margin:22px 0 0;font:300 120px/.9 'Cormorant Garamond',serif;letter-spacing:-.025em}
h1 em{font-style:italic;color:#d6b87a}
p{margin:22px 0 0;font:300 28px/1.4 'Cormorant Garamond',serif;color:#c9c3b6}
#r{position:absolute;left:0;bottom:0;width:1200px;height:212px;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%)}
</style></head><body>
<div class="c"><div class="k">@@CAPS@@</div>
<h1>@@FIRST@@<br><em>@@LAST@@</em></h1>
<p>@@LINE@@</p></div>
<canvas id="r" width="2400" height="424"></canvas>
<script>
var c=document.getElementById('r'),x=c.getContext('2d');x.scale(2,2);
var W=1200,H=212,L=30,P=170,t=3.1;
function amp(u,ti){var s=0;for(var k=0;k<4;k++){var ctr=.14+.22*k+.07*Math.sin(.55*ti+k*1.9),a=.45+.55*Math.max(0,Math.sin(.42*ti+k*1.3+.6)),w=.028+.012*Math.sin(.3*ti+k);s+=a*Math.exp(-((u-ctr)*(u-ctr))/(2*w*w))}
var n=.05*Math.sin(u*61+ti*2.1)+.04*Math.sin(u*113-ti*1.3),env=Math.pow(Math.sin(Math.PI*u),1.4);return Math.max(0,(s*.85+n*.5))*env}
var y0=H*.14,st=H*.8/L,m=0,pk=st*5.4,span=W,ys=[];
for(var i=0;i<L;i++){var y=y0+i*st,ti=t+i*.32,f=i/(L-1),j;x.beginPath();
 for(j=0;j<=P;j++){var u=j/P;ys[j]=y-amp(u,ti)*pk;var px=u*span;j?x.lineTo(px,ys[j]):x.moveTo(px,ys[j])}
 x.lineTo(W,y+st*2);x.lineTo(0,y+st*2);x.closePath();x.fillStyle='#0a0a0a';x.fill();
 x.beginPath();for(j=0;j<=P;j++){var px=j/P*span;j?x.lineTo(px,ys[j]):x.moveTo(px,ys[j])}
 x.strokeStyle='rgba(185,154,91,'+(.18+.55*f).toFixed(3)+')';x.lineWidth=1.1;x.stroke()}
</script></body></html>
